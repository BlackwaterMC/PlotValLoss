<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Loss Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234dabf7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'/%3E%3C/svg%3E">
    <!-- Plotly.js -->
    <script src="/static/vendor/plotly-2.27.0.min.js"></script>
    <script src="/static/shared.js"></script>
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        :root {
            /* Local aliases kept for this file's existing var() references, but
               pointed at the shared.css palette so the values converge. */
            --bg-dark: var(--bg);
            --surface-dark: var(--surface);
            --card-dark: var(--panel);
            --border-dark: var(--border);
            --text-primary: var(--text);
            --text-secondary: var(--text-muted);
            --badge-bg: rgba(77, 171, 247, 0.15);
            --badge-border: rgba(77, 171, 247, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header.app-header {
            background: var(--surface-dark);
            border-bottom: 1px solid var(--border-dark);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-strong);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--accent);
            border: 1px solid var(--badge-border);
            padding: 2px 9px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-warning {
            background: rgba(245, 159, 0, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 159, 0, 0.35);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ui {
            background: var(--card-dark);
            color: var(--text-primary);
            border: 1px solid var(--border-dark);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.825rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .btn-ui:hover {
            background: var(--border-dark);
            color: var(--text-strong);
        }

        .btn-toggle-active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--text-strong);
        }

        .btn-toggle-active:hover {
            background: var(--accent-hover);
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1 1 200px;
            min-width: 150px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-wrapper:focus-within .search-icon {
            color: var(--accent);
        }

        .search-input {
            background: var(--bg-dark);
            border: 1px solid var(--border-dark);
            color: var(--text-primary);
            padding: 6px 12px 6px 30px;
            border-radius: 6px;
            font-size: 0.825rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .combo-select {
            background: var(--card-dark);
            color: var(--text-primary);
            border: 1px solid var(--border-dark);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: border-color 0.15s ease;
            min-width: 130px;
            max-width: 220px;
        }

        .combo-select:focus {
            border-color: var(--accent);
        }

        .combo-select option {
            background: var(--card-dark);
            color: var(--text-primary);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.825rem;
            color: var(--text-secondary);
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .control-group input[type="range"] {
            width: 80px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* Subheader Bar with legend quick controls and combo filters */
        .sub-bar {
            background: rgba(26, 26, 34, 0.7);
            border-bottom: 1px solid var(--border-dark);
            padding: 6px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            gap: 16px;
            flex-wrap: wrap;
        }

        .sub-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filter-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .legend-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 1px solid var(--border-dark);
            padding-left: 14px;
        }

        .sub-btn {
            background: transparent;
            border: 1px solid var(--border-dark);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .sub-btn:hover {
            background: var(--card-dark);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 90px);
        }

        #plot-container {
            width: 100%;
            height: 100%;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(18, 18, 20, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 50;
        }

        /* larger/faster than shared.css .spinner; @keyframes spin from shared.css */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(77, 171, 247, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <div class="app-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                Validation Loss Explorer
            </div>
            <span class="badge" id="runs-badge">Loading runs...</span>
            <span class="badge badge-warning" id="hidden-badge" style="display: none;">0 Hidden (> 1.0)</span>
        </div>

        <div class="header-center">
            <div class="search-wrapper">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search runs or dates..." oninput="filterSeries(this.value)">
            </div>

            <div class="control-group">
                <label for="smoothing-slider">Smooth: <span id="smoothing-val">0.0</span></label>
                <input type="range" id="smoothing-slider" min="0" max="0.95" step="0.05" value="0" oninput="updateSmoothing(this.value)">
            </div>

            <button class="btn-ui" id="btn-scale" onclick="toggleYScale()">Y: Linear</button>
            <button class="btn-ui" onclick="fetchData(true)" title="Refresh data from disk">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                Refresh
            </button>
        </div>

        <!-- Upper Right: X-Axis Mode Toggle -->
        <div class="header-right">
            <div style="display: flex; gap: 4px; background: var(--card-dark); padding: 3px; border-radius: 6px; border: 1px solid var(--border-dark);">
                <button class="btn-ui btn-toggle-active" id="btn-xaxis-steps" onclick="setXAxisMode('steps')">
                    Step
                </button>
                <button class="btn-ui" id="btn-xaxis-time" onclick="setXAxisMode('time')">
                    Relative Time
                </button>
            </div>
        </div>
    </header>

    <div class="sub-bar">
        <div class="sub-bar-left">
            <div class="filter-controls">
                <label class="filter-label" for="combo-filter1">Filter 1:</label>
                <select id="combo-filter1" class="combo-select" onchange="onFilter1Change()"></select>

                <label class="filter-label" for="combo-filter2" style="margin-left: 4px;">Filter 2:</label>
                <select id="combo-filter2" class="combo-select" onchange="onFilter2Change()"></select>
            </div>

            <div class="legend-actions">
                <span>Legend:</span>
                <button class="sub-btn" onclick="showAllTraces()">Show All</button>
                <button class="sub-btn" onclick="hideAllTraces()">Hide All</button>
                <button class="sub-btn" onclick="resetDefaultVisibility()">Reset Default (&le; 1.0)</button>
            </div>
        </div>
        <div id="status-info">Click legend series to toggle, double-click to isolate</div>
    </div>

    <main>
        <div id="plot-scan-progress-overlay" class="progress-overlay">
            <div class="analysis-progress-header">
                <span id="plot-scan-title">Scanning Validation Loss Logs</span>
                <span id="plot-scan-percent">0%</span>
                <button id="btn-cancel-plot-scan" class="progress-cancel-btn" title="Cancel">✕</button>
            </div>
            <div class="progress-bar-container">
                <div id="plot-scan-fill" class="progress-bar-fill"></div>
            </div>
            <div class="analysis-progress-stats">
                <span id="plot-scan-status">Initializing...</span>
                <span id="plot-scan-count">Processing</span>
            </div>
        </div>
        <div id="loading-overlay" style="display: none;">
            <div class="spinner"></div>
            <div id="loading-text" style="color: var(--text-secondary); font-size: 0.9rem;">Scanning SQLite logs...</div>
        </div>
        <div id="plot-container"></div>
    </main>

    <script src="/static/plot_val_loss.js"></script>
</body>
</html>
